<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ทางแยก" />
<meta name="theme-color" content="#120e16" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<title>ทางแยก</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;800&display=swap" rel="stylesheet" />
<style>
:root{
  --text:#fff8ee; --mute:#d9cfd8; --gold:#ffcf6b; --good:#7be0a6; --bad:#ff7a66;
  --glass:rgba(18,13,22,.74); --line:rgba(255,255,255,.14);
  --g:clamp(8px,1.6vmin,18px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#120e16}
body{height:100dvh;color:var(--text);font-family:'Prompt',sans-serif;position:relative}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* scene */
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene *{transition:fill 1.8s ease,stop-color 1.8s ease,opacity 1.8s ease}
.wall rect{transition:opacity .5s ease,transform .8s ease!important}
.bird{animation:fly 14s linear infinite}
.bird:nth-child(2){animation-duration:18s;animation-delay:-6s}
.bird:nth-child(3){animation-duration:22s;animation-delay:-11s}
@keyframes fly{from{transform:translateX(-200px)}to{transform:translateX(1800px)}}
.lantern{animation:rise 9s ease-in-out infinite}
.lantern:nth-child(2n){animation-duration:12s;animation-delay:-4s}
.lantern:nth-child(3n){animation-duration:10s;animation-delay:-7s}
@keyframes rise{0%{transform:translateY(40px)}50%{transform:translateY(-20px)}100%{transform:translateY(40px)}}
.puff{animation:puff 6s ease-in infinite;transform-box:fill-box;transform-origin:center}
.puff:nth-child(2){animation-delay:-2s}.puff:nth-child(3){animation-delay:-4s}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-220px) scale(2.4);opacity:0}}
#ash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;
  background-image:radial-gradient(2px 2px at 20% 30%,#cfc8c0 50%,transparent 51%),radial-gradient(2px 2px at 70% 10%,#cfc8c0 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 40% 60%,#bdb6ae 50%,transparent 51%),radial-gradient(2px 2px at 85% 50%,#cfc8c0 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 55% 85%,#bdb6ae 50%,transparent 51%),radial-gradient(2px 2px at 10% 75%,#cfc8c0 50%,transparent 51%);
  background-size:300px 300px;animation:ash 12s linear infinite}
@keyframes ash{from{background-position:0 0}to{background-position:60px 300px}}
#rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;
  background-image:repeating-linear-gradient(105deg,transparent 0 22px,rgba(200,210,225,.35) 22px 24px,transparent 24px 60px);background-size:120px 240px;animation:rain .5s linear infinite}
@keyframes rain{from{background-position:0 0}to{background-position:-30px 240px}}
#hwall{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.8s ease,fill 1.8s ease!important}
.eps{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);margin:0 0 clamp(12px,2vmin,20px)}
.ep{text-align:left;padding:clamp(14px,2.2vmin,22px);border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.ep:hover{transform:translateY(-3px);border-color:rgba(255,207,107,.6)}
.ep small{display:block;color:var(--gold);font-size:clamp(12px,1.6vmin,16px)}
.ep b{display:block;font-size:clamp(20px,3.2vmin,34px);margin:.1em 0 .2em}
.ep span{display:block;color:var(--mute);font-size:clamp(13px,1.8vmin,18px);line-height:1.45}
#veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(10,8,12,.35),transparent 22%,transparent 45%,rgba(10,8,12,.55))}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:var(--g);
  padding:calc(var(--g) + env(safe-area-inset-top)) calc(var(--g)*1.4) var(--g);z-index:3}
.home{font-size:clamp(13px,1.7vmin,17px);color:var(--text);text-decoration:none;padding:.45em .9em;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dots{display:flex;gap:6px;margin:0 auto}
.dots i{width:clamp(18px,3vmin,34px);height:6px;border-radius:9px;background:rgba(255,255,255,.22);transition:background .4s}
.dots i.on{background:var(--gold)}
.dots i.done{background:rgba(255,207,107,.55)}
.clock{display:flex;align-items:center;gap:.6em;padding:.35em .9em .35em .4em;border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.clock svg{width:clamp(30px,4.6vmin,48px);height:auto}
.clock b{display:block;font-size:clamp(14px,2vmin,20px);line-height:1.1}
.clock small{display:block;font-size:clamp(10px,1.35vmin,13px);color:var(--mute)}
#hand{transition:transform 1.8s cubic-bezier(.3,1.4,.5,1);transform-origin:24px 24px}
.ib{width:clamp(34px,4.6vmin,46px);aspect-ratio:1;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:clamp(14px,2vmin,19px);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib:disabled{opacity:.35;cursor:default}

/* card */
.card{position:absolute;left:50%;bottom:calc(var(--g)*1.4 + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(1040px,94vw);max-height:62dvh;overflow:auto;z-index:2;
  background:var(--glass);border:1px solid var(--line);border-radius:clamp(16px,2.4vmin,26px);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  padding:clamp(16px,3vmin,34px);box-shadow:0 20px 60px rgba(0,0,0,.45);animation:up .5s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.eyebrow{font-size:clamp(12px,1.6vmin,16px);color:var(--gold);letter-spacing:.04em;font-weight:500}
h1{margin:.1em 0 .25em;font-size:clamp(34px,7vmin,76px);line-height:1;font-weight:800}
h2{margin:.15em 0 .4em;font-size:clamp(22px,3.6vmin,40px);line-height:1.2;font-weight:800}
.lede{font-size:clamp(15px,2.3vmin,24px);line-height:1.55;margin:0 0 .8em;color:var(--text)}
.story{font-size:clamp(17px,2.8vmin,30px);line-height:1.5;margin:0 0 clamp(12px,2vmin,22px)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g);margin:0 0 clamp(12px,2vmin,22px);padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;font-size:clamp(13px,1.9vmin,19px);line-height:1.45;color:var(--mute);padding:.8em 1em;border-radius:14px;background:rgba(255,255,255,.06)}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--gold);color:#2a1a08;font-weight:800;margin-right:.5em}
.row{display:flex;align-items:center;gap:var(--g);flex-wrap:wrap}
.hint{font-size:clamp(12px,1.6vmin,16px);color:var(--mute)}
.go{margin-left:auto;padding:.7em 1.5em;border-radius:99px;background:var(--gold);color:#2a1a08;font-weight:800;font-size:clamp(15px,2.2vmin,22px)}
.go:hover{filter:brightness(1.06)}
.ghost{padding:.65em 1.2em;border-radius:99px;border:1px solid var(--line);font-size:clamp(14px,1.9vmin,19px)}

.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g)}
.ch{display:flex;gap:.7em;align-items:flex-start;text-align:left;padding:clamp(12px,2vmin,20px);border-radius:16px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:clamp(15px,2.2vmin,23px);line-height:1.4;transition:transform .2s,background .2s,border-color .2s}
.ch:hover{transform:translateY(-3px);background:rgba(255,255,255,.12);border-color:rgba(255,207,107,.6)}
.ch b{flex:none;display:grid;place-items:center;width:1.8em;height:1.8em;border-radius:50%;background:rgba(255,207,107,.16);color:var(--gold);font-weight:800}

.picked{display:flex;gap:.7em;align-items:center;font-size:clamp(14px,1.9vmin,19px);color:var(--mute);margin-bottom:.5em}
.picked b{color:var(--text)}
.res{font-size:clamp(18px,2.9vmin,31px);line-height:1.5;margin:0 0 clamp(12px,2vmin,22px)}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.35em .9em;border-radius:99px;font-weight:600;font-size:clamp(13px,1.8vmin,18px)}
.chip.up{background:rgba(255,122,102,.16);color:var(--bad)}
.chip.dn{background:rgba(123,224,166,.15);color:var(--good)}

.path{display:grid;gap:6px;margin:0 0 clamp(12px,2vmin,20px)}
.path div{display:grid;grid-template-columns:auto 1fr auto;gap:.8em;align-items:center;padding:.5em .9em;border-radius:12px;background:rgba(255,255,255,.06);font-size:clamp(13px,1.85vmin,19px)}
.path em{font-style:normal;color:var(--mute);white-space:nowrap}
.path .k{width:.7em;height:.7em;border-radius:50%}
.qs{margin:0 0 clamp(12px,2vmin,20px);padding:0;list-style:none;display:grid;gap:var(--g)}
.qs li{font-size:clamp(17px,2.7vmin,29px);line-height:1.45;padding:.6em .9em;border-left:4px solid var(--gold);background:rgba(255,255,255,.05);border-radius:0 12px 12px 0}
blockquote{margin:0 0 .8em;font-size:clamp(16px,2.5vmin,27px);line-height:1.55}
blockquote cite{display:block;margin-top:.35em;font-style:normal;font-size:clamp(12px,1.6vmin,16px);color:var(--gold)}
.src{font-size:clamp(11px,1.4vmin,14px);color:var(--mute)}

.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-50%,0) translateX(-8px)}40%{transform:translate(-50%,0) translateX(7px)}60%{transform:translate(-50%,0) translateX(-4px)}80%{transform:translate(-50%,0) translateX(2px)}}

@media (max-width:720px),(max-aspect-ratio:3/4){
  .choices,.steps,.eps{grid-template-columns:1fr}
  .card{max-height:70dvh}
  .clock small{display:none}
}

/* remote */
#rm{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(10,8,12,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#rm.on{display:grid}
#rm .box{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3.4vmin,36px);text-align:center;width:min(92vw,400px)}
#rm .qr{background:#fff;border-radius:14px;padding:10px;width:min(52vmin,240px);aspect-ratio:1;margin:0 auto 14px;display:grid;place-items:center;color:#555}
#rm .qr svg{width:100%;height:auto;display:block}
#rm .code{font-size:clamp(30px,5.4vmin,46px);letter-spacing:.22em;color:var(--gold);font-weight:800;margin:.05em 0 .1em}
#rm .x{position:absolute;top:10px;right:10px}
.ib.live{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
</style>
</head>

<script>
const EPS=[
 {name:'สองเมือง', no:'ตอนที่ 1', key:'city',
  lede:'เรื่องสมมุติของ “เมืองตะวัน” กับ “เมืองจันทร์” สองเมืองที่ใช้แม่น้ำสายเดียวกัน ทั้งห้องคือชาวเมืองตะวัน ทุกการตัดสินใจจะเปลี่ยนโลกของทั้งสองเมือง',
  card:'เมืองตะวันกับเมืองจันทร์ที่ใช้แม่น้ำสายเดียวกัน',
  st:[
  {title:'ข่าวลือเรื่องเขื่อน',

    <p class="src" style="margin:0 0 1em">ที่มา: วารสารสู่ความสุข เดือนกันยายน 2569 หน้า 55–57</p>${nav(N,last)}`;
}
function openEp(e){
  if(S.ph==='end'&&S.e===0) S.end1=EPS[0].ends.indexOf(endOf(0,S.t));
  S.e=e;S.ph='ep';S.i=0;S.t=T0;S.picks=[];S.slide=0;save();render();
}
function go(){S.ph='ask';save();render()}
function pick(j){
  if(S.ph!=='ask') return;
  const c=STG()[S.i].ch[j], d=delta(c,S.t);
  S.picks.push({s:S.i,j,d,before:S.t}); S.t=clamp(S.t+d,0,100); S.ph='res'; save(); render();
  if(c.k==='force'){const el=$('card');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
}
function next(){
  if(S.ph!=='res') return;
  if(S.i<STG().length-1){S.i++;S.ph='ask'}else{S.ph='end';S.slide=0}
  save(); render();
}
const SL=()=>S.e===0?['end','path','talk','quote','bridge']:['end','path','talk','quote'], NS=()=>SL().length;
function slide(d){S.slide=clamp(S.slide+d,0,NS()-1);save();render()}
function undo(){
  if(S.ph==='alt') return altBack();
  if(S.ph==='res'||S.ph==='end'){const p=S.picks.pop(); if(!p) return; S.t=p.before; S.i=p.s; S.ph='ask'}
  else if(S.ph==='ask'&&S.i>0){const p=S.picks[S.picks.length-1]; S.i=p.s; S.ph='res'}
  save(); render();
}
function restart(){S=fresh();save();render()}
$('undo').onclick=undo;
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{
  if(S.ph==='ask'&&['1','2','3'].includes(e.key)) pick(+e.key-1);
  else if(e.key==='Enter'||e.key==='ArrowRight'){
    if(S.ph==='ep') go(); else if(S.ph==='res') next();
    else if(S.ph==='end') S.slide<NS()-1?slide(1):S.e===0&&openEp(1);
    else if(S.ph==='alt') S.alt.i<STG().length?altStep(1):altBack();
  }
  else if(e.key==='ArrowLeft'&&S.ph==='end') slide(-1);
  else if(e.key==='Backspace') undo();
});
/* remote control (PeerJS, display = host) */
const R={peer:null,conns:[]};
const load=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.append(e)});
function snap(){
  const c=$('card'), q=s=>c.querySelector(s)?.innerText.trim()||'';
  return {eb:q('.eyebrow'),h:q('h1,h2'),tx:q('.story,.res,.lede,.picked'),
    clock:$('mins').innerText,
    undo:!$('undo').disabled,
    btns:[...c.querySelectorAll('button')].map(b=>{const t=x=>b.querySelector(x)?.innerText.trim()||'', cl=b.classList;
      return cl.contains('ch')?{k:'ch',n:t('b'),l:t('span')}:cl.contains('ep')?{k:'ch',n:'▸',l:t('b')+' · '+t('small')}:{k:cl.contains('go')?'go':'gh',l:b.innerText.replace(/\s+/g,' ').trim()}})};
}
function push(){const d=snap();R.conns=R.conns.filter(c=>c.open);R.conns.forEach(c=>c.send(d));$('rbtn').classList.toggle('live',R.conns.length>0)}
new MutationObserver(()=>{clearTimeout(R.t);R.t=setTimeout(push,60)}).observe($('card'),{childList:true,subtree:true});
async function remote(){
  $('rm').classList.add('on'); if(R.peer&&!R.peer.destroyed) return;
  try{await Promise.all([window.Peer||load('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'),window.qrcode||load('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js')])}
  catch{$('qr').textContent='โหลดไม่สำเร็จ ตรวจอินเทอร์เน็ต';return}
  const code=sessionStorage.rc||String(Math.floor(1000+Math.random()*9000));
  const p=R.peer=new Peer('bkk11-ty-'+code);
  p.on('open',()=>{sessionStorage.rc=code;$('rcode').textContent=code;
    const u=new URL('control.html?c='+code,location.href).href, q=qrcode(0,'M');q.addData(u);q.make();$('qr').innerHTML=q.createSvgTag({cellSize:6,margin:0})});
  p.on('error',e=>{if(e.type==='unavailable-id'){delete sessionStorage.rc;p.destroy();remote()}else $('rmsg').textContent='เชื่อมต่อไม่ได้ ('+e.type+')'});
  p.on('disconnected',()=>!p.destroyed&&p.reconnect());
  p.on('connection',c=>{c.on('open',()=>{R.conns.push(c);push();$('rm').classList.remove('on')});
    c.on('data',m=>{if(m.a==='btn')$('card').querySelectorAll('button')[m.i]?.click();else if(m.a==='undo')undo();else if(m.a==='sync')push()});
    c.on('close',push)});
}
$('rbtn').onclick=remote;
if(sessionStorage.rc) remote().then(()=>$('rm').classList.remove('on'));
render();
</script>
