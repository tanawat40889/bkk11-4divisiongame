<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="เกม 4 ฝ่าย" />
<meta name="theme-color" content="#2a0d15" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>เกม 4 ฝ่าย BKK11</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --page:#2a0d15; --shell:#4a1722; --panel:#5c1f2c; --deep:#3a111b;
  --text:#fff3f0; --mute:#e2adb2; --coral:#e9605a; --cream:#fbf2c4; --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--page)}
body{margin:0;min-height:100vh;color:var(--text);font-family:'Prompt',sans-serif;
  background:radial-gradient(80vmax 60vmax at 10% -10%,rgba(233,96,90,.2),transparent 60%),var(--page);
  padding:max(18px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cream);outline-offset:2px}

.shell{max-width:1240px;margin:0 auto;background:var(--shell);border-radius:40px;padding:22px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;
  box-shadow:0 40px 90px rgba(0,0,0,.45)}

/* filter rail */
.rail{background:var(--deep);border-radius:var(--r);padding:22px 16px;display:flex;flex-direction:column;gap:22px;align-self:start;position:sticky;top:22px}
.brand{width:100%;max-width:190px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.group{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;color:var(--mute);margin:0 0 4px 10px}
.opt{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:14px;padding:11px 14px;background:none;color:var(--mute);font-size:16px;cursor:pointer;text-align:left;transition:.15s}
.opt:hover{background:rgba(255,255,255,.05);color:var(--text)}
.opt.on{background:var(--coral);color:#fff;font-weight:600}
.opt span{font-size:13px;opacity:.8}
select{width:100%;border:0;border-radius:14px;padding:11px 14px;background:var(--panel);font-size:15px}

/* main */
main{min-width:0;display:flex;flex-direction:column;gap:26px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hello{margin:0;flex:1 1 auto;font-size:clamp(22px,2.6vw,30px);font-weight:500;color:#ff8a82}
.hello b{color:#fff;font-weight:700}
.search{flex:0 1 380px;display:flex;align-items:center;gap:10px;background:var(--deep);border-radius:99px;padding:0 18px;height:50px;min-width:0}
.search input{flex:1;min-width:0;background:none;border:0;font-size:16px;outline:none}
.search input::placeholder{color:var(--mute)}

.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:380px;padding:34px 36px;display:flex;flex-direction:column;gap:14px;background:var(--art);isolation:isolate}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(55,8,18,.6) 0%,rgba(55,8,18,.2) 55%,transparent 80%);z-index:-1}
.hero .art{position:absolute;right:-10px;bottom:-40px;font-size:clamp(170px,20vw,280px);line-height:1;z-index:-1;transform:rotate(-8deg);filter:drop-shadow(0 30px 40px rgba(0,0,0,.35))}
.pill{align-self:flex-start;background:var(--cream);color:#3a1a10;font-weight:600;font-size:15px;border-radius:99px;padding:7px 16px}
.hero h1{margin:0;font-size:clamp(34px,4.4vw,56px);font-weight:800;line-height:1.08}
.hero .desc{margin:0;max-width:30em;font-size:15.5px;line-height:1.6;color:#ffe9e5}
.hero ol{margin:0;padding-left:20px;max-width:32em;font-size:14.5px;line-height:1.65;color:#ffe2dc}
.play{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:#fff;color:#2a0d15;font-weight:700;font-size:17px;border-radius:99px;padding:12px 24px 12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .15s}
.play:hover{transform:translateY(-2px)}
.play i{width:32px;height:32px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-style:normal;font-size:13px}

h2{margin:0 0 14px 4px;font-size:22px;font-weight:600}
h2 span{color:var(--mute);font-weight:400;font-size:16px}
.strip{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 16px;scrollbar-width:thin;scrollbar-color:var(--panel) transparent}
.card{flex:0 0 min(78vw,290px);height:320px;scroll-snap-align:start;border-radius:var(--r);position:relative;overflow:hidden;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--art);isolation:isolate;transition:transform .2s,box-shadow .2s}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(30,6,12,.9) 0%,rgba(30,6,12,.25) 55%,transparent 80%);z-index:-1}
.card .art{position:absolute;top:16px;right:-14px;font-size:140px;line-height:1;z-index:-2;transform:rotate(10deg);transition:transform .4s}
.card:hover{transform:translateY(-4px);box-shadow:0 24px 40px rgba(0,0,0,.35)}
.card:hover .art{transform:rotate(0) scale(1.06)}
.card .m{font-size:13px;color:var(--cream);font-weight:500}
.card h3{margin:4px 0 6px;font-size:21px;font-weight:700;line-height:1.2}
.card p{margin:0;font-size:13.5px;line-height:1.5;color:#f4d6d3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--mute);padding:30px 4px}

@media (max-width:820px){
  body{padding-left:10px;padding-right:10px}
  .shell{grid-template-columns:1fr;padding:14px;border-radius:30px}
  .rail{position:static;padding:16px;gap:14px}
  .brand{max-width:150px}
  .group{flex-direction:row;flex-wrap:wrap} .label{display:none}
  .opt{flex:1 1 auto;justify-content:center;gap:6px;padding:9px 12px;font-size:15px}
  .search{flex-basis:100%}
  .hero{min-height:440px;padding:26px 22px} .hero .art{font-size:170px;opacity:.55}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <img class="brand" src="icons/bkk11-logo.png" alt="BKK11 รวมภาคกรุงเทพ" width="360" height="141" />
    <div class="group" id="type">
      <p class="label">ประเภท</p>
      <button class="opt on" data-v="all">ทั้งหมด <span></span></button>
      <button class="opt" data-v="month">ประจำเดือน <span></span></button>
      <button class="opt" data-v="sp">พิเศษ <span></span></button>
    </div>
    <div class="group">
      <p class="label">เรียงลำดับ</p>
      <select id="sort" aria-label="เรียงลำดับ">
        <option value="new">ใหม่สุดก่อน</option><option value="old">เก่าสุดก่อน</option><option value="name">ชื่อ ก–ฮ</option>
      </select>
    </div>
  </aside>

  <main>
    <div class="top">
      <h1 class="hello" id="hello"></h1>
      <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="ค้นหาเกม เช่น XO, SDGs, ออนไลน์" /></label>
    </div>
    <section class="hero" id="hero"></section>
    <section><h2 id="secTitle"></h2><div id="list"></div></section>
  </main>
</div>

<script>
// เพิ่มเกมใหม่ไว้ใน array นี้ (ym = เดือนที่ทำ ใช้เรียงลำดับ, art = สีพื้นการ์ด)
const GAMES = [
  {
    ym:'2026-10', icon:'🌈', title:'ใครทำก็ได้', art:'linear-gradient(135deg,#ff8a5b 0%,#e9605a 45%,#a3324a 100%)',
    desc:'เกม Reflect วิถีชีวิตพลเมืองโลก เดือนตุลาคม “การเคารพศักดิ์ศรีของทุกคน” (SDGs เป้าหมายที่ 5 ความเสมอภาคทางเพศ)',
    steps:[
      'จอขึ้นคำ 1 คำ เช่น “ทำกับข้าว” “ร้องไห้” “เป็นผู้นำ”',
      'นับ 3-2-1 แล้วทุกคนชูมือตอบตามความรู้สึกแรก: ชาย / หญิง / ใครก็ได้',
      'กดคำตอบที่คนส่วนใหญ่เลือก ดูเฉลยและชวนคุยสั้นๆ',
      'เล่นครบ 12 คำ แล้วต่อด้วยสรุปผล คำถามสะกิดใจ 3 ข้อ และคำกล่าว อ.อิเคดะ',
      'ไม่มีแพ้ชนะ เล่นได้ทั้งในห้องและทาง Zoom (พิมพ์ 1 / 2 / 3 ในแชต)',
    ],
    tags:['ทั้งห้องเล่นด้วยกัน','12 คำ','SDGs 5','Reflect ต.ค.','7–10 นาที'],
  },
  {
    special:true, ym:'2026-10', path:'special-triamudom/', label:'✦ Special · กลุ่มเตรียมอุดม', icon:'💖', title:'XO พลเมืองโลก × เตรียมอุดม',
    art:'linear-gradient(135deg,#ff3ea5 0%,#a855f7 55%,#4b2a8f 100%)',
    desc:'XO พลเมืองโลกฉบับพิเศษสำหรับน้องๆ กลุ่มเตรียมอุดม (อุดมศึกษา) ธีมสีวัยรุ่น คัดคำถามมา 16 ข้อ',
    steps:[
      'แบ่งเป็น 2 ทีม คือ ทีม X กับทีม O (หรือใช้โหมดออนไลน์ ทุกคนเล่นกับ “ความเฉยเมย”)',
      'กด “สุ่มคำถาม” ใครเคยทำยกมือ ทีมที่ยกมือมากกว่าชนะรอบ',
      'ตัวแทนทีมเล่าเรื่องจริงสั้นๆ 30 วินาที แล้วเลือกช่องบนกระดาน',
      'ทีมที่เรียงครบ 3 ช่องก่อนชนะ',
    ],
    tags:['2 ทีม / ออนไลน์','16 คำถาม','Gen Z','อุดมศึกษา'],
  },
  {
    ym:'2026-09', icon:'⭕', title:'XO พลเมืองโลก', art:'linear-gradient(135deg,#f6b24a 0%,#d9573f 50%,#7d2233 100%)',
    desc:'เกม XO แข่ง 2 ทีม ทีมที่มีคนเคยทำความดีตามคำถามมากกว่า ได้สิทธิ์เลือกช่อง พร้อมเล่าเรื่องจริงจากประสบการณ์',
    steps:[
      'แบ่งผู้เข้าร่วมเป็น 2 ทีม คือ ทีม X กับทีม O',
      'กด “สุ่มคำถาม” เช่น “ใครเคยช่วยผู้สูงอายุถือของ?”',
      'คนที่เคยทำยกมือ ทีมที่ยกมือมากกว่าชนะรอบนั้น',
      'ทีมที่ชนะส่งตัวแทนเล่าเรื่องสั้นๆ ประมาณ 30 วินาที แล้วเลือกช่องบนกระดาน',
      'ทีมที่เรียงครบ 3 ช่องก่อนชนะ ถ้าเสมอให้ทั้งสองทีมเล่าเรื่อง',
      '💻 โหมดออนไลน์ (Zoom): ทุกคนอยู่ทีมเดียวกัน เล่นกับ “ความเฉยเมย” ถ้ามีคนกด Raise Hand ถึงเป้า ทุกคนได้เลือกช่อง ถ้าไม่ถึง ความเฉยเมยได้ลงช่องแทน',
    ],
    tags:['2 ทีม / ออนไลน์','28 คำถาม','พลเมืองโลก','ปฏิบัติศรัทธา','คำกล่าว อ.อิเคดะ'],
  },
];
const TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const mLabel=ym=>{const [y,m]=ym.split('-').map(Number);return TH[m-1]+' '+(y+543)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const href=g=>g.path||g.ym+'/';
const sub=g=>g.special?g.label:mLabel(g.ym);

const F={q:'',type:'all',sort:'new'};
const sorter={new:(a,b)=>b.ym.localeCompare(a.ym)||(a.special?1:-1),old:(a,b)=>a.ym.localeCompare(b.ym),name:(a,b)=>a.title.localeCompare(b.title,'th')};
const match=g=>{const q=F.q.trim().toLowerCase(); return !q||[g.title,g.desc,g.label||'',mLabel(g.ym),...g.tags,...g.steps].join(' ').toLowerCase().includes(q)};
const byType=g=>F.type==='all'||(F.type==='sp')===!!g.special;
// featured = newest monthly game; shown only on the unfiltered default view
const FEAT=GAMES.filter(g=>!g.special).sort(sorter.new)[0];

function render(){
  const browsing=F.q.trim()||F.type!=='all';
  const hero=$('hero');
  hero.hidden=browsing||!FEAT;
  if(!hero.hidden){
    hero.style.setProperty('--art',FEAT.art);
    hero.innerHTML=`<span class="art" aria-hidden="true">${FEAT.icon}</span>
      <span class="pill">🔥 เกมเดือน${esc(mLabel(FEAT.ym))}</span>
      <h1>${esc(FEAT.title)}</h1>
      <p class="desc">${esc(FEAT.desc)}</p>
      <ol>${FEAT.steps.slice(0,4).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <a class="play" href="${href(FEAT)}"><i>▶</i>เข้าเล่น</a>`;
  }
  const gs=GAMES.filter(g=>match(g)&&byType(g)&&(browsing||g!==FEAT)).sort(sorter[F.sort]);
  $('secTitle').innerHTML=browsing?`ผลลัพธ์ <span>(${gs.length})</span>`:'เกมอื่นๆ';
  $('secTitle').hidden=!gs.length&&!browsing;
  $('list').innerHTML=gs.length?`<div class="strip">${gs.map(g=>`
    <a class="card" href="${href(g)}" style="--art:${g.art}">
      <span class="art" aria-hidden="true">${g.icon}</span>
      <span class="m">${esc(sub(g))}</span>
      <h3>${esc(g.title)}</h3>
      <p>${esc(g.desc)}</p>
    </a>`).join('')}</div>`:browsing?'<p class="empty">ไม่พบเกมที่ค้นหา</p>':'';
}

const count={all:GAMES.length,month:GAMES.filter(g=>!g.special).length,sp:GAMES.filter(g=>g.special).length};
document.querySelectorAll('#type .opt').forEach(b=>b.querySelector('span').textContent=count[b.dataset.v]);
$('type').onclick=e=>{const b=e.target.closest('.opt'); if(!b) return; F.type=b.dataset.v; document.querySelectorAll('#type .opt').forEach(x=>x.classList.toggle('on',x===b)); render()};
$('sort').onchange=e=>{F.sort=e.target.value;render()};
$('q').oninput=e=>{F.q=e.target.value;render()};

const h=new Date().getHours();
$('hello').innerHTML=`${h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':h<20?'สวัสดีตอนเย็น':'สวัสดีตอนค่ำ'}, <b>BKK11</b>`;
render();
</script>
</body>
</html>
