<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="เกม 4 ฝ่าย" />
<meta name="theme-color" content="#0f1220" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>เกม 4 ฝ่าย BKK11</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0f1220; --panel:#181c30; --line:#2b3150; --text:#eef0ff; --mute:#9aa1c7;
  --gold:#ffd166; --x:#ff5d73; --o:#3ec5ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Prompt',sans-serif;
  padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:1100px;margin:0 auto}
header{margin-bottom:clamp(20px,4vw,40px)}
h1{margin:0;font-size:clamp(30px,5vw,54px);font-weight:800;line-height:1.15}
h1 span{color:var(--gold)}
header p{margin:6px 0 0;color:var(--mute);font-size:clamp(15px,2vw,20px)}
.sec{color:var(--mute);font-size:15px;font-weight:600;letter-spacing:.5px;margin:32px 0 12px;display:flex;align-items:center;gap:12px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.row .card{flex:0 0 min(86vw,420px);scroll-snap-align:start}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.bar input,.bar select{font:inherit;font-size:15px;color:var(--text);background:#10142a;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.bar input{flex:1 1 220px;min-width:0}
.bar input:focus,.bar select:focus{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;gap:4px;background:#10142a;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:8px;padding:6px 12px;background:none;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--gold);color:#1a1a1a}
.sec .n{font-weight:400;opacity:.7}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:22px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card.latest{border:2px solid var(--gold);background:linear-gradient(160deg,#232948 0%,var(--panel) 60%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.month{font-weight:600;color:var(--gold);font-size:15px}
.badge{font-size:13px;font-weight:600;padding:3px 12px;border-radius:99px;background:var(--gold);color:#1a1a1a}
.title{display:flex;align-items:center;gap:14px}
.icon{font-size:44px;line-height:1}
.card h2{margin:0;font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.2}
.desc{color:var(--mute);margin:10px 0 14px;font-size:16px;line-height:1.55}
.card h3{margin:0 0 6px;font-size:15px;color:var(--text)}
ol{margin:0;padding-left:22px;line-height:1.65;font-size:15.5px;color:#d4d8f5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:#232843;color:var(--mute)}
.go{margin-top:auto;padding-top:18px;font-weight:600;color:var(--gold);font-size:17px}
.card.sp{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(120deg,#ff3ea5,#a855f7,#2ee6ff) border-box}
.card.sp .month{background:linear-gradient(90deg,#ff3ea5,#a855f7,#2ee6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card.sp:hover{box-shadow:0 10px 34px rgba(255,62,165,.3)}
.empty{color:var(--mute);font-size:15px}
</style>
</head>
<body>
<main>
  <header>
    <h1>เกม <span>4 ฝ่าย</span> BKK11</h1>
    <p>รวมเกมกิจกรรมประจำเดือน เลือกเดือนเพื่อเข้าเล่น</p>
  </header>
  <div class="bar">
    <input id="q" type="search" placeholder="🔍 ค้นหาเกม เช่น XO, SDGs, ออนไลน์" />
    <div class="seg" id="type">
      <button data-v="all" class="on">ทั้งหมด</button><button data-v="month">ประจำเดือน</button><button data-v="sp">พิเศษ</button>
    </div>
    <select id="sort" aria-label="เรียงลำดับ">
      <option value="new">ใหม่สุดก่อน</option><option value="old">เก่าสุดก่อน</option><option value="name">ชื่อ ก–ฮ</option>
    </select>
  </div>
  <div id="list"></div>
</main>

<script>
// เพิ่มเกมใหม่ไว้ใน array นี้ (ym = เดือนที่ทำ ใช้เรียงลำดับ)
const GAMES = [
  {
    ym:'2026-10', icon:'🌈', title:'ใครทำก็ได้',
    desc:'เกม Reflect วิถีชีวิตพลเมืองโลก เดือนตุลาคม “การเคารพศักดิ์ศรีของทุกคน” (SDGs เป้าหมายที่ 5 ความเสมอภาคทางเพศ)',
    steps:[
      'จอขึ้นคำ 1 คำ เช่น “ทำกับข้าว” “ร้องไห้” “เป็นผู้นำ”',
      'นับ 3-2-1 แล้วทุกคนชูมือตอบตามความรู้สึกแรก: ชาย / หญิง / ใครก็ได้',
      'กดคำตอบที่คนส่วนใหญ่เลือก ดูเฉลยและชวนคุยสั้นๆ',
      'เล่นครบ 12 คำ แล้วต่อด้วยสรุปผล คำถามสะกิดใจ 3 ข้อ และคำกล่าว อ.อิเคดะ',
      'ไม่มีแพ้ชนะ เล่นได้ทั้งในห้องและทาง Zoom (พิมพ์ 1 / 2 / 3 ในแชต)',
    ],
    tags:['ทั้งห้องเล่นด้วยกัน','12 คำ','SDGs 5','Reflect ต.ค.','7–10 นาที'],
  },
  {
    special:true, ym:'2026-10', path:'special-triamudom/', label:'✦ Special · กลุ่มเตรียมอุดม', icon:'💖', title:'XO พลเมืองโลก × เตรียมอุดม',
    desc:'XO พลเมืองโลกฉบับพิเศษสำหรับน้องๆ กลุ่มเตรียมอุดม (อุดมศึกษา) ธีมสีวัยรุ่น คัดคำถามมา 16 ข้อ',
    steps:[
      'แบ่งเป็น 2 ทีม คือ ทีม X กับทีม O (หรือใช้โหมดออนไลน์ ทุกคนเล่นกับ “ความเฉยเมย”)',
      'กด “สุ่มคำถาม” ใครเคยทำยกมือ ทีมที่ยกมือมากกว่าชนะรอบ',
      'ตัวแทนทีมเล่าเรื่องจริงสั้นๆ 30 วินาที แล้วเลือกช่องบนกระดาน',
      'ทีมที่เรียงครบ 3 ช่องก่อนชนะ',
    ],
    tags:['2 ทีม / ออนไลน์','16 คำถาม','Gen Z','อุดมศึกษา'],
  },
  {
    ym:'2026-09', icon:'⭕', title:'XO พลเมืองโลก',
    desc:'เกม XO แข่ง 2 ทีม ทีมที่มีคนเคยทำความดีตามคำถามมากกว่า ได้สิทธิ์เลือกช่อง พร้อมเล่าเรื่องจริงจากประสบการณ์',
    steps:[
      'แบ่งผู้เข้าร่วมเป็น 2 ทีม คือ ทีม X กับทีม O',
      'กด “สุ่มคำถาม” เช่น “ใครเคยช่วยผู้สูงอายุถือของ?”',
      'คนที่เคยทำยกมือ ทีมที่ยกมือมากกว่าชนะรอบนั้น',
      'ทีมที่ชนะส่งตัวแทนเล่าเรื่องสั้นๆ ประมาณ 30 วินาที แล้วเลือกช่องบนกระดาน',
      'ทีมที่เรียงครบ 3 ช่องก่อนชนะ ถ้าเสมอให้ทั้งสองทีมเล่าเรื่อง',
      '💻 โหมดออนไลน์ (Zoom): ทุกคนอยู่ทีมเดียวกัน เล่นกับ “ความเฉยเมย” ถ้ามีคนกด Raise Hand ถึงเป้า ทุกคนได้เลือกช่อง ถ้าไม่ถึง ความเฉยเมยได้ลงช่องแทน',
    ],
    tags:['2 ทีม / ออนไลน์','28 คำถาม','พลเมืองโลก','ปฏิบัติศรัทธา','คำกล่าว อ.อิเคดะ'],
  },
];

const TH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const mLabel=ym=>{const [y,m]=ym.split('-').map(Number);return TH[m-1]+' '+(y+543)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const card=(g,latest)=>`
<a class="card${latest?' latest':''}${g.special?' sp':''}" href="${g.path||g.ym+'/'}">
  <div class="top"><span class="month">${g.special?esc(g.label):'📅 '+mLabel(g.ym)}</span>${latest?'<span class="badge">ล่าสุด</span>':''}</div>
  <div class="title"><span class="icon">${g.icon}</span><h2>${esc(g.title)}</h2></div>
  <p class="desc">${esc(g.desc)}</p>
  <h3>วิธีเล่น</h3>
  <ol>${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
  <div class="chips">${g.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
  <div class="go">เข้าเล่น →</div>
</a>`;

const latestYm=GAMES.filter(g=>!g.special).map(g=>g.ym).sort().pop();
const F={q:'',type:'all',sort:'new'};
const $=id=>document.getElementById(id);
const sorter={new:(a,b)=>b.ym.localeCompare(a.ym),old:(a,b)=>a.ym.localeCompare(b.ym),name:(a,b)=>a.title.localeCompare(b.title,'th')};
const match=g=>{const q=F.q.trim().toLowerCase(); return !q||[g.title,g.desc,g.label||'',mLabel(g.ym),...g.tags,...g.steps].join(' ').toLowerCase().includes(q)};
const sec=(t,list)=>list.length?`<div class="sec">${t} <span class="n">(${list.length})</span></div><div class="row">${list.map(g=>card(g,!g.special&&g.ym===latestYm)).join('')}</div>`:'';
function render(){
  const gs=GAMES.filter(match).sort(sorter[F.sort]);
  const mo=F.type==='sp'?[]:gs.filter(g=>!g.special), sp=F.type==='month'?[]:gs.filter(g=>g.special);
  $('list').innerHTML=(sec('เกมประจำเดือน',mo)+sec('เกมพิเศษ',sp))||'<p class="empty">ไม่พบเกมที่ค้นหา</p>';
}
$('q').oninput=e=>{F.q=e.target.value;render()};
$('sort').onchange=e=>{F.sort=e.target.value;render()};
$('type').onclick=e=>{const v=e.target.dataset.v; if(!v) return; F.type=v; [...$('type').children].forEach(x=>x.classList.toggle('on',x===e.target)); render()};
render();
</script>
</body>
</html>
